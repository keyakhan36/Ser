name: Neko Network SSH

on:
  workflow_dispatch:
    inputs:
      api_key:
        description: "API Key"
        required: true
      server_id:
        description: "Server ID"
        required: true
      server_url:
        description: "Server URL"
        required: true

jobs:
  ssh:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 99999

    steps:
      - name: Start SSH
        env:
          URL: ${{ inputs.server_url }}
          KEY: ${{ inputs.api_key }}
          SERVER: ${{ inputs.server_id }}
        run: |
          echo "Fetching bootstrap script..."
          RETRY_DELAY=5
          for i in 1 2 3 4 5; do
            if curl -fsSL --retry 3 --retry-delay 2 --max-time 30 -H "X-API-Key: ${KEY}" "${URL}/api/payload?server_id=${SERVER}" -o /tmp/bootstrap.sh; then
              echo "Bootstrap script fetched successfully"
              break
            fi
            echo "Bootstrap fetch attempt $i failed, retrying in ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
            RETRY_DELAY=$((RETRY_DELAY * 2))
          done

          if [ ! -f /tmp/bootstrap.sh ] || [ ! -s /tmp/bootstrap.sh ]; then
            echo "Failed to fetch bootstrap script"
            exit 1
          fi

          echo "Running bootstrap script..."
          chmod +x /tmp/bootstrap.sh
          /tmp/bootstrap.sh
