name: Neko Network SSH

on:
  workflow_dispatch:
    inputs:
      api_key:
        description: "API Key"
        required: true
      server_id:
        description: "Server ID"
        required: true
      server_url:
        description: "Server URL"
        required: true

jobs:
  ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 99999

    steps:
      - name: SSH Tunnel
        env:
          NEKO_SERVER_URL: ${{ inputs.server_url }}
          NEKO_API_KEY: ${{ inputs.api_key }}
          NEKO_SERVER_ID: ${{ inputs.server_id }}
        run: |
          curl -fsSL --retry 3 --retry-delay 2 --max-time 30 \
            -H "X-API-Key: $NEKO_API_KEY" \
            "$NEKO_SERVER_URL/api/download/agent" -o neko-agent \
            && chmod +x neko-agent \
            && ./neko-agent
