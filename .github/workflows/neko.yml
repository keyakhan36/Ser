name: Neko Network SSH (Optimized)

on:
  workflow_dispatch:
    inputs:
      api_key:
        description: "API Key"
        required: true
      server_id:
        description: "Server ID"
        required: true
      server_url:
        description: "Server URL (e.g., https://neko.example.com)"
        required: true

jobs:
  ssh:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 400

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: nyatoru          
          password: ${{ secrets.GHCR_TOKEN }}
          
      - name: SSH Tunnel
        env:
          NEKO_API_URL: ${{ inputs.server_url }}
          NEKO_API_KEY: ${{ inputs.api_key }}
          NEKO_SERVER_ID: ${{ inputs.server_id }}
        run: |
          # Derive main API URL from tunnel URL (remove ssh. subdomain)
          MAIN_API_URL=$(echo "$NEKO_API_URL" | sed 's|https://ssh\.|https://|')
          echo "Using main API for agent download: $MAIN_API_URL"
          echo "Using tunnel URL for agent connection: $NEKO_API_URL"

          # Download agent from main API domain
          curl -fsSL --retry 3 --retry-delay 2 --max-time 30 \
            -H "X-API-Key: $NEKO_API_KEY" \
            "$MAIN_API_URL/api/payload-agent?run_id=$NEKO_SERVER_ID" \
            -o neko-agent \
            && chmod +x neko-agent \
            && ./neko-agent
