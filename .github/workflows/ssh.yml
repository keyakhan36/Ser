name: Jayedlab 

on:
  workflow_dispatch:
    inputs:
      os_choice:
        description: "Choose OS base (ubuntu2204)"
        type: choice
        required: true
        default: 'ubuntu2204'
        options:
         - "ubuntu2204"
      ssh_username:
        description: "Custom SSH username"
        required: false
        default: ""
      ssh_password:
        description: "Custom SSH password (blank = auto)"
        required: false
        default: ""
      uptime:
        description: "Uptime (e.g. 1h, 6h)"
        required: false
        default: "10h"
      nt_choice:
        description: "Send to Telegram Notification"
        type: choice
        required: true
        default: 'yes'
        options:
         - "no"
         - "yes"

jobs:
  agent-2:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 99999

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install tools
        run: sudo apt-get install -y gettext-base jq bc zstd

      - name: Select Dockerfile
        id: select
        run: |
          FILE="Dockerfile.ubuntu"
          if [ ! -f "$FILE" ]; then
            echo "❌ Error: $FILE not found!"
            exit 1
          fi
          echo "DOCKERFILE=$FILE" >> $GITHUB_ENV
          echo "✅ Using $FILE"


      - name: Build Docker Image (if no cache)
        run: |
          echo "🔨 Cache miss! Building fresh image..."
          docker build -f $DOCKERFILE -t ssh-frp-docker:latest .
          
          # Save image for next time
          echo "💾 Saving image to cache..."
          mkdir -p docker-cache

      # --- 🚀 Run ---
      - name: Run container
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          USERNAME="${{ inputs.ssh_username }}"
          PASS_INPUT="${{ inputs.ssh_password }}"
          if [ -z "$PASS_INPUT" ]; then
            PASS=$(openssl rand -base64 15 | tr -dc A-Za-z0-9 | head -c 10)
          else
            PASS="$PASS_INPUT"
          fi
          
          echo "🚀 Starting Container..."
          docker run -d --rm -i \
            --name sshd-test \
            --hostname neko-network \
            --group-add 993 \
            --device /dev/kvm \
            --cap-drop ALL \
            --cap-add SYS_ADMIN \
            --cap-add SYS_CHROOT \
            --cap-add SETUID \
            --cap-add SETGID \
            --cap-add CHOWN \
            --cap-add DAC_OVERRIDE \
            --cap-add FOWNER \
            --cap-add NET_ADMIN \
            --cap-add NET_RAW \
            --cap-add NET_BIND_SERVICE \
            --cap-add MKNOD \
            --cap-add AUDIT_WRITE \
            --security-opt no-new-privileges=false \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --tmpfs /tmp:rw,exec,size=4g \
            --tmpfs /run:rw,exec,size=256m \
            -e USERNAME=$USERNAME \
            -e PASSWORD=$PASS \
            -e BUILDBUDDY_API_KEY=$BUILDBUDDY_API_KEY \
            -p 2700:2700 \
             ssh-frp-docker:latest

          echo "SSH_USER=$USERNAME" >> $GITHUB_ENV
          echo "SSH_PASS=$PASS" >> $GITHUB_ENV

      # --- 🌐 Network Setup (FRP v0.66.0) ---
      - name: Download FRP (v0.66.0)
        run: |
          curl -L https://github.com/fatedier/frp/releases/download/v0.66.0/frp_0.66.0_linux_amd64.tar.gz -o frp.tar.gz
          tar -xzf frp.tar.gz
          mv frp_0.66.0_linux_amd64 frp

      - name: Configure frpc
        id: frp
        run: |
           set -e
           SUCCESS=0
           mkdir -p frp
           
           for i in {1..9}; do
             RAND=$((2000 + RANDOM % 3001))
             echo "🔎 Trying port ${RAND} (Attempt $i)..."
             
             cp frpc.toml.template frp/frpc.toml
             sed -i "s/__FRPS_ADDR__/${{ secrets.FRPS_IP }}/" frp/frpc.toml
             sed -i "s/__FRPS_PORT__/7000/" frp/frpc.toml
             sed -i "s/__FRP_TOKEN__/${{ secrets.FRPS_TOKEN }}/" frp/frpc.toml
             sed -i "s/__LOCAL_PORT__/2700/" frp/frpc.toml
             sed -i "s/__PORT__/${RAND}/" frp/frpc.toml
             sed -i "s/__NAME__/ssh_${RAND}/" frp/frpc.toml

             timeout 3s ./frp/frpc -c frp/frpc.toml > frpc_probe.log 2>&1 || true

             if grep -Eqi "start proxy success|new proxy.*success" frpc_probe.log; then
                echo "✅ Port ${RAND} is available!"
                echo "FRP_PORT=$RAND" >> $GITHUB_ENV
                SUCCESS=1
                break
             else
                echo "⚠️ Port ${RAND} failed or busy/timeout."
                sleep 1
             fi
           done
 
           if [ $SUCCESS -ne 1 ]; then
            echo "❌ Failed to find available port." >&2
            exit 1
           fi

      - name: Run FRPC (Background)
        run: |
          nohup ./frp/frpc -c frp/frpc.toml > frpc.log 2>&1 &
          sleep 1

      - name: Show Connection Info
        run: |
          echo "============================================"
          echo "   ✅ CONNECT TO YOUR BUILD MACHINE"
          echo "============================================"
          echo "ssh $SSH_USER@144.24.140.245 -p $FRP_PORT"
          echo "Password: $SSH_PASS"
          echo "============================================"
          echo ""
          echo "SSH_CONNECTION_INFO<<EOF" >> $GITHUB_ENV
          echo "Username: $SSH_USER" >> $GITHUB_ENV
          echo "Password: $SSH_PASS" >> $GITHUB_ENV
          echo "Host: ssh.nekolabs.site" >> $GITHUB_ENV
          echo "Port: $FRP_PORT" >> $GITHUB_ENV
          echo "Command: ssh $SSH_USER@ssh.nekolabs.site -p $FRP_PORT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # --- 📱 Send to Telegram ---
      - name: Send SSH Details to Telegram
        if: ${{ inputs.nt_choice == 'yes' }}
        run: |
          MESSAGE="🚀 *SSH Server Ready!*%0A%0A"
          MESSAGE+="👤 *Username:* \`$SSH_USER\`%0A"
          MESSAGE+="🔑 *Password:* \`$SSH_PASS\`%0A"
          MESSAGE+="🌐 *Host:* \`ssh.nekolabs.site\`%0A"
          MESSAGE+="🔌 *Port:* \`$FRP_PORT\`%0A%0A"
          MESSAGE+="📝 *Command:*%0A"
          MESSAGE+="\`\`\`%0Assh $SSH_USER@144.24.140.245 -p $FRP_PORT%0A\`\`\`%0A%0A"
          MESSAGE+="\`\`\`%0A $SSH_PASS\`\`\`%0A%0A"
          MESSAGE+="🧑‍💻 *Started by:* ${{ github.actor }}%0A"
          MESSAGE+="⏱️ *Uptime:* ${{ inputs.uptime }}%0A"
          MESSAGE+="🖥️ *OS:* ${{ inputs.os_choice }}%0A"
          MESSAGE+="📅 *Started:* $(date -u +'%Y-%m-%d %H:%M:%S UTC')%0A"
          MESSAGE+="🔗 *Workflow:* [View Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="Markdown" \
            -d text="$MESSAGE"

      - name: Keep Alive
        run: |
          sleep ${{ inputs.uptime }}

      # --- 📱 Send Shutdown Notification ---
      - name: Send Shutdown Notification to Telegram
        if: always()
        run: |
          END_MESSAGE="🔴 *SSH Server Stopped*%0A%0A"
          END_MESSAGE+="🖥️ *Server:* \`ssh.nekolabs.site:$FRP_PORT\`%0A"
          END_MESSAGE+="👤 *User:* \`$SSH_USER\`%0A"
          END_MESSAGE+="🧑‍💻 *Started by:* ${{ github.actor }}%0A"
          END_MESSAGE+="📅 *Ended:* $(date -u +'%Y-%m-%d %H:%M:%S UTC')%0A%0A"
          
          if [ "${{ job.status }}" == "success" ]; then
            END_MESSAGE+="✅ *Status:* Uptime completed normally"
          elif [ "${{ job.status }}" == "cancelled" ]; then
            END_MESSAGE+="⚠️ *Status:* Workflow cancelled"
          else
            END_MESSAGE+="❌ *Status:* Server crashed or failed"
          fi
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="Markdown" \
            -d text="$END_MESSAGE"
